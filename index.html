<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app use the full screen around the notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My Library</title>
    <meta name="description" content="Track the physical books I own, read, lend and want to buy." />
    <meta name="theme-color" content="#f6f0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1713" media="(prefers-color-scheme: dark)" />
    <!-- iPhone home-screen app settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Library" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Fonts: Fraunces (headings) and Inter (body). Change in src/theme/theme.css too. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Safety net: if the app fails to start (old iPhone, broken update, blocked
      script), show a readable message instead of a blank page. Written in old,
      simple JavaScript on purpose so it runs everywhere.
    -->
    <div id="boot-error" hidden style="font-family:-apple-system,sans-serif;padding:calc(env(safe-area-inset-top) + 24px) 20px 24px;max-width:560px;margin:0 auto;color:#2b231c">
      <h1 style="font-family:Georgia,serif;font-size:24px">My Library couldn't start</h1>
      <p>Please tap <b>Try Again</b>. If it still doesn't open, tap <b>Reset App</b> (your books are kept) and try again.</p>
      <p>If that doesn't help, take a screenshot of this page and send it to Claude.</p>
      <p style="display:flex;gap:10px">
        <button id="boot-retry" style="font-size:17px;padding:10px 18px;border-radius:999px;border:0;background:#b4532a;color:#fff">Try Again</button>
        <button id="boot-reset" style="font-size:17px;padding:10px 18px;border-radius:999px;border:1px solid #ccc;background:#fff;color:#2b231c">Reset App</button>
      </p>
      <pre id="boot-details" style="white-space:pre-wrap;font-size:12px;background:#efe6d8;padding:10px;border-radius:8px"></pre>
    </div>
    <script>
      (function () {
        var errors = [];
        function show(reason) {
          if (window.__appStarted) return;
          var box = document.getElementById('boot-error');
          if (!box) return;
          box.hidden = false;
          document.getElementById('boot-details').textContent =
            reason + '\n' + errors.join('\n') + '\n\nDevice: ' + navigator.userAgent + '\nAddress: ' + location.href;
        }
        window.addEventListener('error', function (e) {
          errors.push('Error: ' + (e.message || (e.target && e.target.src) || 'unknown') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          errors.push('Promise: ' + (e.reason && (e.reason.message || e.reason)));
        });
        setTimeout(function () { show('The app did not finish starting within 10 seconds.'); }, 10000);
        // Also catch the app disappearing after it started (a crash that blanks the page).
        var checks = 0;
        var watcher = setInterval(function () {
          checks++;
          var root = document.getElementById('root');
          if (window.__appStarted && root && root.children.length === 0) {
            window.__appStarted = false;
            show('The app started, then the screen went blank.');
            clearInterval(watcher);
          }
          if (checks > 30) clearInterval(watcher);
        }, 1000);
        document.getElementById('boot-retry').onclick = function () { location.reload(); };
        // Reset = forget the saved copy of the app's code (NOT your books), then reload.
        document.getElementById('boot-reset').onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.filter(function (k) { return k !== 'book-covers'; }).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
