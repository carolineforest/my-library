<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app use the full screen around the notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My Library</title>
    <meta name="description" content="Track the physical books I own, read, lend and want to buy." />
    <meta name="theme-color" content="#f6f0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1713" media="(prefers-color-scheme: dark)" />
    <!-- iPhone home-screen app settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Library" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Fonts: Fraunces (headings) and Inter (body). Change in src/theme/theme.css too. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />
  </head>

    <script type="module" src="/src/main.tsx"></script>
